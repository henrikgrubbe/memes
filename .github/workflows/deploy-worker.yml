name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - "src/shared/**"
      - "src/hosted/worker/**"
      - "src/hosted/task.ts"
      - "!src/**/*.test.ts"
      - "!src/**/*test-support.ts"
      - "infra/scaleway/images/worker.Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.worker.json"
      - ".dockerignore"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-runtime.yml
    with:
      dockerfile: infra/scaleway/images/worker.Dockerfile
      image_name: worker
      runtime: worker
    secrets: inherit
