name: Apply infrastructure

# Deploying a container image and applying infrastructure are separate paths:
# deploy-ingress/deploy-worker watch the Dockerfiles, and this watches the
# OpenTofu configuration. Without it a merged .tf change passes CI and then
# never reaches production, because nothing else in the repo runs tofu apply.
on:
  push:
    branches: [main]
    paths:
      - "infra/scaleway/**.tf"
      - ".github/workflows/infra-apply.yml"
      - ".github/workflows/infra-tofu.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    uses: ./.github/workflows/infra-tofu.yml
    with:
      # Not `production`: that environment is what deploy-ingress and
      # deploy-worker publish images through, and gating it on a reviewer to
      # protect applies also blocked every routine image deploy. Applies are
      # gated here instead, on their own environment and their own key.
      environment: infra-production
      mode: apply
    secrets: inherit
