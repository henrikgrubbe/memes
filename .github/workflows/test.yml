name: Test

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".prettierignore"
      - "tsconfig.json"
      - "vitest.config.ts"
  pull_request:
    paths:
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".prettierignore"
      - "tsconfig.json"
      - "vitest.config.ts"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - run: npm ci

      - run: npm run format:check

      - run: npm test
