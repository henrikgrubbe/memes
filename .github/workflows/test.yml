name: Test

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".prettierignore"
      - ".github/workflows/*.yml"
      - "tsconfig.json"
      - "tsconfig.ingress.json"
      - "tsconfig.worker.json"
      - "vitest.config.ts"
      - "infra/scaleway/images/**"
      - "infra/scaleway/deploy/**"
      - "infra/scaleway/*.tf"
      - "infra/scaleway/*.sh"
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".prettierignore"
      - ".github/workflows/*.yml"
      - "tsconfig.json"
      - "tsconfig.ingress.json"
      - "tsconfig.worker.json"
      - "vitest.config.ts"
      - "infra/scaleway/images/**"
      - "infra/scaleway/deploy/**"
      - "infra/scaleway/*.tf"
      - "infra/scaleway/*.sh"

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Formatting
            script: format:check
          - name: Lint
            script: lint:ci
          - name: Typecheck
            script: typecheck

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.name }}
        run: npm run ${{ matrix.script }}

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test with coverage
        run: npm run test:coverage:ci

      - name: Add coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        shell: bash
        run: |
          node <<'NODE'
          const { appendFileSync, readFileSync } = require("node:fs");
          const { total } = JSON.parse(
            readFileSync("coverage/coverage-summary.json", "utf8"),
          );
          const rows = ["statements", "branches", "functions", "lines"].map(
            (metric) =>
              `| ${metric[0].toUpperCase()}${metric.slice(1)} | ${total[metric].pct}% | ${total[metric].covered} / ${total[metric].total} |`,
          );
          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              "## Coverage",
              "",
              "| Metric | Coverage | Covered |",
              "| --- | ---: | ---: |",
              ...rows,
              "",
            ].join("\n"),
          );
          NODE

      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-and-coverage-reports-${{ github.run_attempt }}
          path: |
            reports/junit.xml
            coverage/
          if-no-files-found: warn
          retention-days: 14

  images:
    name: Verify ${{ matrix.runtime }} image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: ingress
            dockerfile: infra/scaleway/images/ingress.Dockerfile
          - runtime: worker
            dockerfile: infra/scaleway/images/worker.Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: |
          docker build \
            --tag "memes-${{ matrix.runtime }}:ci" \
            --file "${{ matrix.dockerfile }}" \
            .

      - name: Start image and check health
        shell: bash
        run: |
          runtime="${{ matrix.runtime }}"
          image="memes-${runtime}:ci"
          container="memes-${runtime}-${{ github.run_id }}-${{ github.run_attempt }}"

          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          if [[ "$runtime" == "ingress" ]]; then
            configuration=(
              --env GITHUB_WEBHOOK_SECRET=ci-dummy
              --env HOSTED_INGRESS_MODE=off
              --env SQS_ACCESS_KEY=ci-dummy
              --env SQS_ENDPOINT=https://sqs.invalid
              --env SQS_QUEUE_URL=https://sqs.invalid/queue
              --env SQS_REGION=nl-ams
              --env SQS_SECRET_KEY=ci-dummy
            )
          else
            configuration=(
              --env GITHUB_API_URL=https://api.github.invalid
              --env GITHUB_FINE_GRAINED_PAT=ci-dummy
              --env GITHUB_REPOSITORY=example/memes
              --env SLACK_WEBHOOK_URL=https://example.invalid/webhook
              --env WORKER_MODE=diagnostic
            )
          fi

          docker run \
            --detach \
            --name "$container" \
            --publish 127.0.0.1::8080 \
            "${configuration[@]}" \
            "$image"

          address=$(docker port "$container" 8080/tcp)
          health_url="http://127.0.0.1:${address##*:}/health"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$health_url"; then
              exit 0
            fi
            sleep 1
          done

          docker logs "$container"
          exit 1

  deployment:
    name: Deployment script
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Test deployment behavior
        run: infra/scaleway/deploy/deploy-runtime.test.sh

  infrastructure:
    name: OpenTofu
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Initialize providers
        run: tofu -chdir=infra/scaleway init -backend=false

      - name: Check formatting
        run: tofu -chdir=infra/scaleway fmt -check

      - name: Validate configuration
        run: tofu -chdir=infra/scaleway validate
