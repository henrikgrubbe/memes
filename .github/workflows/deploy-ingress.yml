name: Deploy ingress

on:
  push:
    branches: [main]
    paths:
      - "src/hosted/ingress/**"
      - "src/hosted/task.ts"
      - "!src/**/*.test.ts"
      - "infra/scaleway/images/ingress.Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.ingress.json"
      - ".dockerignore"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-runtime.yml
    with:
      dockerfile: infra/scaleway/images/ingress.Dockerfile
      image_name: webhook
      runtime: ingress
    secrets: inherit
